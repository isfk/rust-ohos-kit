[workspace]
resolver = "2"
members = ["rust/core", "rust/bridge"]
# Host-side work is the core only: `cargo test` on a Mac must not need a phone,
# an NDK, or the bridge. The bridge is built for the OHOS target by name.
default-members = ["rust/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
