[package]
name = "rustkit-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The NAPI surface of the core: the only crate here that knows a phone exists."

[lib]
name = "rustcore"
crate-type = ["cdylib"]

[dependencies]
rustkit-core = { path = "../core" }
rustkit-store = { version = "0.1.0", path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Pinned to the version that is in Cargo.lock on purpose: `build.rs` calls
# `cc::Build::compile_intermediates()`, which `cc` documents as an unstable API.
# A caret range would let cargo pick a minor release that changes its shape, and
# the failure is a link error that reads like a Rust problem.
cc = "=1.11.0"
